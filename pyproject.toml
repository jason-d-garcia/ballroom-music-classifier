[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballroom-music-classifier"
version = "0.1.0"
description = "Tell which ballroom dance a song fits (International Standard, Latin, American Smooth)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy",
    "pandas",
    "scikit-learn>=1.3",
    "matplotlib",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
# The MERT model. MERT's remote code breaks on some newer transformers releases; this range is known to work.
model = ["torch>=2.2", "transformers>=4.38,<4.50", "nnAudio>=0.3.2"]
dev = ["pytest>=8", "torch>=2.2"]

[project.scripts]
ballroom-classify = "ballroom.classify:main"

[tool.setuptools]
packages = ["ballroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
